[package]
name = "plume_core"
description = "Core library for Impactor tools."
edition = "2024"
version = "2.6.5"
authors = ["C <claration@riseup.net>"]
license = "MPL-2.0"
repository = "https://github.com/claration/Impactor"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread"] }
plist = "1.8"
uuid = { version = "1.3", features = ["v4", "fast-rng", "macro-diagnostics"] }
thiserror = "2.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
goblin = "0.9"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "gzip", "system-proxy"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
sha2 = "0.11"
# Cryptography
aes = "0.9"
aes-gcm = "0.11.0-rc.3"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = "0.13"
hmac = "0.13"
rsa = "0.9"
# Certificates
x509-certificate = "0.24"
pem = "3.0"
pem-rfc7468 = "0.7"
rcgen = "0.12"
sha1 = "0.10"             # p12
p12-keystore = "0.2"      # p12 crate only supports legacy PKCS#12
# Forks
apple-codesign = { version = "0.29.0", default-features = false }
omnisette = { path = "../omnisette", features = [
    "remote-anisette-v3",
] }
srp = "0.7.0-rc.1"

# There is a bug in rustls-platform-verifier that causes an invalid certificate error with apple's root cert.
# It has been fixed already but I am waiting for a new release before I can update the dependency.
# Using native-tls avoids the issue.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", features = [
    "json",
    "gzip",
    "native-tls",
    "system-proxy",
] }

[features]
default = []
tweaks = []
